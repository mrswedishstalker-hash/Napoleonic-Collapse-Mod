 generals_jean_bar_name:0 "#bold Soult, the Armed Forces#!\nFill the bar to 1000 within ten years. Each month adds:\n+5  France has the strongest army AND the strongest navy in the world\n+3  The Armed Forces are in government with over 15% clout\n+5  France has defeated Great Britain in a war since this began\n+2  Mass Conscription AND Professional Navy are enacted\n+5  France is the top-ranked power in the world\n-10  The Armed Forces are marginalized\n\n#bold Reward:#! Napoleonic Stratocracy."
