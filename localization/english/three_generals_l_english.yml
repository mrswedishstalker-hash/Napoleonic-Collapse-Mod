 generals_bertrand_bar_name:0 "#bold Clauzel, the Landowners#!\nFill the bar to 1000 within ten years. Each month adds:\n+6  Agrarianism is enacted\n+3  State Religion is enacted\n+3  Tenant Farmers OR Serfdom is enacted\n+3  Subjecthood is enacted\n+3  Local Police is enacted\n-10  The Landowners are marginalized\n\n#bold Reward:#! Monarchy and Napoleonic Absolutism. Clauzel becomes monarch, with a landowner heir."
 generals_bertrand_bar_desc:0 "Clauzel"
 generals_reille_bar_name:0 "#bold Reille, the Intelligentsia#!\nFill the bar to 1000 within ten years. Each month adds:\n+5  Multiculturalism is enacted (+2 for Cultural Exclusion instead)\n+2  Laissez-Faire is enacted (+1 for Interventionism instead)\n+1  Free Trade is enacted\n+3  Commercialized Agriculture is enacted\n+2  National Guard is enacted\n+2  Child Labor is not allowed\n+3  Slavery is banned\n-10  The Intelligentsia are marginalized\n\n#bold Reward:#! Advised Monarchy and Guided Technocracy. Reille becomes monarch, with an intelligentsia heir."
